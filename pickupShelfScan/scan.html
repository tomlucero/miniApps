<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pickup Shelf Scan</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --text:#1c1f24; --muted:#6a7280; --line:#dde2e8;
          --accent:#126a64; --err:#b3261e; --errbg:#fdecea; --okbg:#e7f2f1;
          --pink:#d63384; --pinkbg:#fde4f0; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#14161a; --card:#1e2127; --text:#eceef1; --muted:#9aa3b0; --line:#2d323a;
            --accent:#4cb7a8; --err:#f2877f; --errbg:#3a1f1d; --okbg:#173330;
            --pink:#f48fc0; --pinkbg:#3d1f2e; }
  }
  * { box-sizing:border-box; }
  body { margin:0; padding:16px; background:var(--bg); color:var(--text);
         font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  .wrap { max-width:460px; margin:0 auto; }
  h1 { font-size:20px; margin:4px 0 12px; }
  .card { background:var(--card); border-radius:14px; box-shadow:0 1px 4px rgba(0,0,0,.12);
          padding:16px; margin-bottom:12px; }
  label.small { display:block; font-size:13px; color:var(--muted); margin-bottom:4px; }
  input[type=text] { width:100%; font-size:16px; padding:10px 12px; border:1px solid var(--line);
                     border-radius:10px; background:var(--bg); color:var(--text); }

  /* The scanner "types" into this box. inputmode=none keeps the phone keyboard closed. */
  #scanBox { position:relative; text-align:center; padding:18px 12px; border-radius:12px;
             border:2px dashed var(--line); transition:background .15s, border-color .15s; }
  #scanBox.ready { border-color:var(--accent); }
  #scanBox.flash-ok  { background:var(--okbg); }
  #scanBox.flash-err { background:var(--errbg); border-color:var(--err); }
  #scanInput { position:absolute; inset:0; width:100%; height:100%; opacity:0; border:0; font-size:16px; }
  #count { font-size:52px; font-weight:800; line-height:1; font-variant-numeric:tabular-nums; }
  #countLabel { color:var(--muted); font-size:14px; margin-top:4px; }
  #feedback { min-height:22px; margin-top:10px; font-size:15px; font-weight:600; }
  #feedback.ok { color:var(--accent); } #feedback.err { color:var(--err); }
  #readyHint { font-size:13px; color:var(--muted); margin-top:6px; }

  .btn { display:block; width:100%; padding:14px; font-size:17px; font-weight:700; border-radius:12px;
         border:2px solid var(--accent); background:transparent; color:var(--accent);
         touch-action:manipulation; margin-top:10px; }
  .btn.primary { background:var(--accent); color:#fff; }
  .btn:disabled { opacity:.45; }
  #stickerBtn { border-color:var(--pink); color:var(--pink); }
  #stickerBtn.armed { background:var(--pink); color:#fff; }
  .row2 { display:flex; gap:10px; } .row2 .btn { flex:1; }

  #list { list-style:none; margin:0; padding:0; }
  #list li { display:flex; align-items:center; gap:10px; padding:10px 4px; border-bottom:1px solid var(--line); }
  #list li:last-child { border-bottom:0; }
  .pl { flex:1; font-size:18px; font-variant-numeric:tabular-nums; font-weight:600; }
  .tag { font-size:12px; font-weight:700; padding:6px 10px; border-radius:999px; border:1px solid var(--line);
         color:var(--muted); background:transparent; touch-action:manipulation; }
  .tag.on { background:var(--pinkbg); color:var(--pink); border-color:var(--pink); }
  .x { border:0; background:transparent; color:var(--muted); font-size:22px; padding:0 6px; touch-action:manipulation; }
  .muted { color:var(--muted); font-size:14px; }
  #submitStatus { margin-top:10px; font-size:15px; min-height:20px; }
  #submitStatus.ok { color:var(--accent); } #submitStatus.err { color:var(--err); }
</style>
</head>
<body>
<div class="wrap">
  <h1>Pickup Shelf Scan</h1>

  <div class="card">
    <label class="small" for="who">Your name</label>
    <input type="text" id="who" autocomplete="name" placeholder="First name">
  </div>

  <div class="card">
    <div id="scanBox">
      <input id="scanInput" inputmode="none" autocomplete="off" autocapitalize="off" spellcheck="false"
             aria-label="Scanner input">
      <div id="count">0</div>
      <div id="countLabel">bags scanned</div>
      <div id="feedback" role="status" aria-live="polite"></div>
      <div id="readyHint">Tap here, then scan</div>
    </div>
    <button class="btn" id="stickerBtn" type="button" aria-pressed="false">Next bag has a pink sticker</button>
  </div>

  <div class="card">
    <button class="btn primary" id="submitBtn" type="button" disabled>Finish &amp; submit</button>
    <div id="submitStatus" role="status"></div>
    <div class="row2">
      <button class="btn" id="clearBtn" type="button">Start over</button>
    </div>
    <p class="muted" id="lastInfo"></p>
  </div>

  <div class="card">
    <div class="muted" style="margin-bottom:6px">Newest first. Tap the sticker tag to fix it, or ✕ to remove a bag.</div>
    <ul id="list"></ul>
  </div>
</div>

<script>
// ---- EDIT THESE TWO LINES ----------------------------------------------------
const ENDPOINT   = 'https://script.google.com/macros/s/AKfycbz5X3rZIbOklNBNlLM3IiBaiwsV0uow6vu3xKj7KzOiNkVH5G0ConDCKWD19MGkSagx8g/exec';   // the Apps Script web app URL, ends in /exec
const SHARED_KEY = 'OSSfgQHYhEWD6rLP9b8SwqeCySAY';                // must match SHARED_KEY in Code.gs
// ------------------------------------------------------------------------------

const PLID_LENGTH = 7;          // PL IDs are 7 digits. Anything else is rejected as a misread.
const LOW_COUNT_WARNING = 0.7;  // warn before submitting if this scan is under 70% of the current one
const DRAFT_KEY = 'pickupShelfScan.draft.v1';
const NAME_KEY  = 'pickupShelfScan.name';

const $ = id => document.getElementById(id);
const input = $('scanInput');

let bags = [];             // [{ id, stickered, at }] in scan order
let stickerArmed = false;  // one-shot: applies to the next scan only
let currentCount = null;   // size of the scan in the sheet right now
let busy = false;

/* ---------- storage (best effort; the page works without it) ---------- */
function saveDraft() { try { localStorage.setItem(DRAFT_KEY, JSON.stringify(bags)); } catch (e) {} }
function loadDraft() {
  try { const d = JSON.parse(localStorage.getItem(DRAFT_KEY) || '[]'); if (Array.isArray(d)) bags = d; } catch (e) {}
}
try { $('who').value = localStorage.getItem(NAME_KEY) || ''; } catch (e) {}
$('who').addEventListener('change', () => { try { localStorage.setItem(NAME_KEY, $('who').value.trim()); } catch (e) {} });

/* ---------- feedback ---------- */
let audio;
function beep(ok) {
  try {
    audio = audio || new (window.AudioContext || window.webkitAudioContext)();
    const o = audio.createOscillator(), g = audio.createGain();
    o.frequency.value = ok ? 1200 : 300; g.gain.value = 0.08;
    o.connect(g); g.connect(audio.destination); o.start(); o.stop(audio.currentTime + (ok ? 0.07 : 0.3));
  } catch (e) {}
}
let flashTimer;
function feedback(ok, text) {
  const box = $('scanBox');
  $('feedback').className = ok ? 'ok' : 'err';
  $('feedback').textContent = text;
  box.classList.remove('flash-ok', 'flash-err');
  box.classList.add(ok ? 'flash-ok' : 'flash-err');
  clearTimeout(flashTimer);
  flashTimer = setTimeout(() => box.classList.remove('flash-ok', 'flash-err'), ok ? 350 : 1200);
  beep(ok);
  if (!ok && navigator.vibrate) navigator.vibrate(200);
}

/* ---------- scanning ---------- */
function handleScan(raw) {
  const id = String(raw).replace(/\s+/g, '');
  if (!id) return;
  if (!new RegExp('^\\d{' + PLID_LENGTH + '}$').test(id)) {
    feedback(false, '“' + id.slice(0, 20) + '” is not a PL ID. Not added.');
    return;
  }
  const existing = bags.find(b => b.id === id);
  if (existing) {
    feedback(false, id + ' already scanned. Skipped.');
    return;
  }
  bags.push({ id, stickered: stickerArmed, at: new Date().toISOString() });
  feedback(true, (stickerArmed ? '✓ ' + id + ' (pink sticker)' : '✓ ' + id));
  setSticker(false);
  saveDraft();
  render();
}

input.addEventListener('keydown', e => {
  if (e.key === 'Enter' || e.key === 'Tab') {   // Wasp scanners end each scan with Enter by default
    e.preventDefault();
    handleScan(input.value);
    input.value = '';
  }
});

function focusScanner() { if (!busy) input.focus({ preventScroll: true }); }
function updateReady() {
  const ready = document.activeElement === input;
  $('scanBox').classList.toggle('ready', ready);
  $('readyHint').textContent = ready ? 'Ready. Scan the next bag.' : 'Tap here, then scan';
}
input.addEventListener('focus', updateReady);
input.addEventListener('blur', updateReady);

/* ---------- sticker toggle (one scan at a time) ---------- */
function setSticker(on) {
  stickerArmed = on;
  $('stickerBtn').classList.toggle('armed', on);
  $('stickerBtn').setAttribute('aria-pressed', String(on));
  $('stickerBtn').textContent = on ? 'Pink sticker ON for next scan (tap to cancel)' : 'Next bag has a pink sticker';
}
$('stickerBtn').addEventListener('click', () => { setSticker(!stickerArmed); focusScanner(); });

/* ---------- list ---------- */
function render() {
  $('count').textContent = bags.length;
  $('countLabel').textContent = (bags.length === 1 ? 'bag' : 'bags') + ' scanned' +
    (bags.some(b => b.stickered) ? ' · ' + bags.filter(b => b.stickered).length + ' with pink sticker' : '');
  $('submitBtn').disabled = busy || bags.length === 0;
  const list = $('list');
  list.innerHTML = '';
  bags.slice().reverse().forEach(b => {
    const li = document.createElement('li');
    const pl = document.createElement('span'); pl.className = 'pl'; pl.textContent = b.id;
    const tag = document.createElement('button');
    tag.type = 'button'; tag.className = 'tag' + (b.stickered ? ' on' : '');
    tag.textContent = b.stickered ? 'Pink sticker' : 'No sticker';
    tag.addEventListener('click', () => { b.stickered = !b.stickered; saveDraft(); render(); focusScanner(); });
    const x = document.createElement('button');
    x.type = 'button'; x.className = 'x'; x.setAttribute('aria-label', 'Remove ' + b.id); x.textContent = '✕';
    x.addEventListener('click', () => {
      if (!confirm('Remove ' + b.id + ' from this scan?')) return;
      bags = bags.filter(o => o !== b); saveDraft(); render(); focusScanner();
    });
    li.append(pl, tag, x);
    list.appendChild(li);
  });
}

/* ---------- server ---------- */
const configured = () => !ENDPOINT.includes('PASTE') && SHARED_KEY !== 'CHANGE-ME';
function setSubmit(cls, text) { $('submitStatus').className = cls; $('submitStatus').textContent = text; }

async function loadCurrentInfo() {
  if (!configured()) { $('lastInfo').textContent = 'Not set up yet: no endpoint in scan.html.'; return; }
  try {
    const d = await (await fetch(ENDPOINT + '?action=latest')).json();
    if (!d.ok) return;
    currentCount = d.current.bags.length;
    $('lastInfo').textContent = d.current.submittedAt
      ? 'Last submitted scan: ' + currentCount + ' bags, ' + new Date(d.current.submittedAt).toLocaleString() +
        (d.current.submittedBy ? ' by ' + d.current.submittedBy : '') + '.'
      : 'No scan has been submitted yet.';
  } catch (e) { $('lastInfo').textContent = 'Could not check the last scan (offline?). You can keep scanning.'; }
}

$('submitBtn').addEventListener('click', async () => {
  if (!bags.length || busy) return;
  if (!configured()) { setSubmit('err', 'This page has not been set up yet (no endpoint).'); return; }
  const who = $('who').value.trim();
  if (!who) { setSubmit('err', 'Enter your name first.'); $('who').focus(); return; }

  let msg = 'Replace the current shelf scan with these ' + bags.length + ' bags?\n\n' +
            'Make sure you scanned EVERY bag on the pickup shelves. Bags you skipped will not show up on the PC.';
  if (currentCount && bags.length < currentCount * LOW_COUNT_WARNING) {
    msg = '⚠ The last scan had ' + currentCount + ' bags. This one only has ' + bags.length + '.\n\n' +
          'Did you miss a shelf? ' + msg;
  }
  if (!confirm(msg)) { focusScanner(); return; }

  busy = true; render(); setSubmit('', 'Submitting...');
  try {
    // text/plain avoids a CORS preflight, which Apps Script web apps do not answer
    const res = await fetch(ENDPOINT, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ key: SHARED_KEY, action: 'submit', by: who, bags })
    });
    const d = await res.json();
    if (d.ok) {
      setSubmit('ok', '✓ Submitted ' + d.count + ' bags. Open the Pickup Reminders page on the PC.');
      currentCount = d.count;
      bags = []; saveDraft();
      $('feedback').textContent = '';
      loadCurrentInfo();
    } else {
      setSubmit('err', 'Not saved. Server said: ' + d.error + '. Your scans are still here.');
    }
  } catch (e) {
    setSubmit('err', 'Could not reach the server (' + e.message + '). Your scans are still here; try again.');
  } finally {
    busy = false; render();
  }
});

$('clearBtn').addEventListener('click', () => {
  if (bags.length && !confirm('Throw away the ' + bags.length + ' bags scanned so far? (Nothing has been submitted.)')) return;
  bags = []; setSticker(false); saveDraft(); render(); setSubmit('', ''); $('feedback').textContent = ''; focusScanner();
});

/* ---------- start ---------- */
loadDraft();
if (bags.length) setSubmit('', 'Picked up where you left off: ' + bags.length + ' bags not submitted yet.');
render();
loadCurrentInfo();
$('scanBox').addEventListener('click', focusScanner);
focusScanner();
updateReady();
</script>
</body>
</html>
