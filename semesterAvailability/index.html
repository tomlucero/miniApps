<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Semester Availability | CSU Bookstore</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;750;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://kit.fontawesome.com/b65fbcdd34.js" crossorigin="anonymous"></script>
  <link rel="stylesheet" href="../shared-theme.css?v=20260621-1">
  <link rel="stylesheet" href="style.css?v=20260804-3">
</head>
<body>
  <div class="screen-only">
    <header class="suite-hero">
      <div class="suite-hero-image" role="img" aria-label="Colorado State University Lory Student Center"></div>
      <div class="suite-hero-inner">
        <div>
          <a class="suite-back" href="../index.html">&larr; Return to Toolbox</a>
          <p class="suite-eyebrow">Scheduling helper</p>
          <h1>Semester Availability</h1>
          <p class="suite-lead">Students mark the blocks of time they cannot work. The grid below is the printable sheet the supervisor receives.</p>
        </div>
        <img class="suite-logo" src="../productListingHTMLBuilder/images/bookstoreLogo.png" alt="CSU Bookstore logo">
      </div>
    </header>

    <main class="workspace-band">
      <div class="container">
        <div class="row g-4 align-items-start">
          <div class="col-xl-4">
            <form id="availabilityForm" class="card setup-card" novalidate>
              <div class="card-body p-4">
                <div class="panel-title mb-4">
                  <div>
                    <p class="suite-eyebrow">Student setup</p>
                    <h2>Sheet details</h2>
                  </div>
                  <button class="btn btn-outline-secondary btn-sm" id="resetButton" type="button">Reset</button>
                </div>

                <div class="row g-3">
                  <div class="col-12">
                    <label class="form-label" for="employeeName">Student Name</label>
                    <input class="form-control" id="employeeName" type="text" autocomplete="name" required placeholder="Student name">
                  </div>
                  <div class="col-md-6">
                    <label class="form-label" for="role">Job / Area</label>
                    <select class="form-select" id="role">
                      <option>Online</option>
                      <option>Receiving</option>
                    </select>
                  </div>
                  <div class="col-md-6">
                    <label class="form-label" for="phone">Phone</label>
                    <input class="form-control" id="phone" type="tel" autocomplete="tel" inputmode="numeric" maxlength="14" required placeholder="(555) 555-5555">
                  </div>
                  <div class="col-12">
                    <label class="form-label" for="semesterPreset">Semester</label>
                    <select class="form-select" id="semesterPreset"></select>
                  </div>
                  <div class="col-md-6">
                    <label class="form-label" for="termStart">Start</label>
                    <input class="form-control" id="termStart" type="date" readonly>
                  </div>
                  <div class="col-md-6">
                    <label class="form-label" for="termEnd">End</label>
                    <input class="form-control" id="termEnd" type="date" readonly>
                  </div>
                </div>

                <hr class="my-4">

                <fieldset>
                  <legend class="form-label mb-2">Add unavailable blocks</legend>
                  <label class="form-label">Unavailable days</label>
                  <div class="day-checks" id="dayChecks">
                    <label><input type="checkbox" value="Monday"> Mon</label>
                    <label><input type="checkbox" value="Tuesday"> Tue</label>
                    <label><input type="checkbox" value="Wednesday"> Wed</label>
                    <label><input type="checkbox" value="Thursday"> Thu</label>
                    <label><input type="checkbox" value="Friday"> Fri</label>
                    <label><input type="checkbox" value="Saturday"> Sat</label>
                    <label><input type="checkbox" value="Sunday"> Sun</label>
                  </div>

                  <div class="row g-3 mt-1">
                    <div class="col-md-6">
                      <label class="form-label" for="startTime">From</label>
                      <input class="form-control time-entry" id="startTime" type="text" inputmode="text" required placeholder="9:00 AM">
                    </div>
                    <div class="col-md-6">
                      <label class="form-label" for="endTime">Until</label>
                      <input class="form-control time-entry" id="endTime" type="text" inputmode="text" required placeholder="5:00 PM">
                    </div>
                    <div class="col-12">
                      <label class="form-label" for="reason">Reason</label>
                      <select class="form-select" id="reason">
                        <option>Class</option>
                        <option>Other job</option>
                        <option>Practice</option>
                        <option>Family</option>
                        <option>Appointment</option>
                        <option>Personal</option>
                        <option>Other</option>
                      </select>
                    </div>
                    <div class="col-12">
                      <button class="btn btn-primary w-100" type="submit"><i class="fa-solid fa-plus" aria-hidden="true"></i> Add Block</button>
                    </div>
                  </div>
                </fieldset>

                <div class="form-status mt-3" id="formStatus" role="status" aria-live="polite"></div>

                <div class="action-row mt-4">
                  <button class="btn btn-primary" id="printButton" type="button"><i class="fa-solid fa-print" aria-hidden="true"></i> Print Grid</button>
                  <button class="btn btn-outline-secondary" id="downloadPdfButton" type="button"><i class="fa-solid fa-file-pdf" aria-hidden="true"></i> Download PDF</button>
                  <button class="btn btn-outline-secondary" id="clearTimesButton" type="button"><i class="fa-solid fa-eraser" aria-hidden="true"></i> Clear Blocks</button>
                </div>
              </div>
            </form>
          </div>

          <div class="col-xl-8">
            <section class="card preview-panel" aria-labelledby="previewHeading">
              <div class="preview-panel-head">
                <div>
                  <p class="suite-eyebrow">Printable grid</p>
                  <h2 id="previewHeading">Times they cannot work</h2>
                </div>
                <span class="conflict-count" id="conflictCount">0 blocks</span>
              </div>

              <div class="sheet-preview" id="sheetPreview"></div>

              <div class="notes-panel">
                <label class="form-label" for="notes">Notes for Supervisor</label>
                <textarea class="form-control" id="notes" rows="3" placeholder="One-time conflicts, schedule changes, or anything else the supervisor should know."></textarea>
              </div>
            </section>
          </div>
        </div>
      </div>
    </main>
  </div>

  <div class="print-area" id="printArea" aria-label="Printable semester availability sheet"></div>
  <script src="https://cdn.jsdelivr.net/npm/html2pdf.js@0.10.2/dist/html2pdf.bundle.min.js"></script>
  <script src="script.js?v=20260804-3"></script>
</body>
</html>
